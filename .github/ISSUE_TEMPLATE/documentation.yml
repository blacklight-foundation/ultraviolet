name: Documentation Issue
description: Report stale, missing, unclear, or incorrect documentation.
title: "[docs]: "
labels:
  - needs-triage
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Use this for documentation problems. Questions belong in GitHub Discussions:
        https://github.com/blacklight-foundation/ultraviolet/discussions
  - type: input
    id: document
    attributes:
      label: Affected document
      placeholder: "README.md, CONTRIBUTING.md, Docs/SPECIFICATION.md, ..."
    validations:
      required: true
  - type: textarea
    id: current-text
    attributes:
      label: Current text or location
      description: Paste the stale/incorrect text or identify the missing section.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is stale, missing, confusing, or incorrect.
    validations:
      required: true
  - type: textarea
    id: proposed-correction
    attributes:
      label: Proposed correction
      description: Suggest replacement text or the information that should be added.
    validations:
      required: false
  - type: checkboxes
    id: affected-areas
    attributes:
      label: Affected area
      options:
        - label: Public alpha build or install instructions
        - label: Conformance or HelloUltraviolet instructions
        - label: Security reporting
        - label: Contribution process
        - label: Normative specification wording
        - label: Changelog or release notes
