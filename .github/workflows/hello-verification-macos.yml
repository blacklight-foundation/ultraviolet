name: HelloUltraviolet macOS Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verification:
    name: aarch64-darwin
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          lfs: false

      - name: Install CMake 4.0.2
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/cmake-venv/bin/python" -m pip install cmake==4.0.2
          scripts_dir="$RUNNER_TEMP/cmake-venv/bin"
          echo "$scripts_dir" >> "$GITHUB_PATH"
          echo "UV_CMAKE_EXE=$scripts_dir/cmake" >> "$GITHUB_ENV"

      - name: Verify host tools
        run: |
          "$UV_CMAKE_EXE" --version
          python3 --version
          xcode-select -p
          xcrun --find clang++
          xcrun --show-sdk-path

      - name: Fetch target extern payloads
        run: python3 Tools/FetchTargetExterns.py --target-profile aarch64-darwin

      - name: Plan compiler release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 Tools/PlanCompilerRelease.py \
            --sha "$GITHUB_SHA" \
            --release-kind auto \
            --skip-validation \
            --write-env "$GITHUB_ENV" \
            --summary compiler-release-plan.md
          cat compiler-release-plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run HelloUltraviolet verification
        run: |
          set -o pipefail
          mkdir -p artifacts
          print_source_native_diagnostics() {
            transcript_path="$1"
            echo "==== Source-native diagnostics files ====" | tee -a "$transcript_path"
            found_diagnostics=0
            while IFS= read -r diagnostics_file; do
              found_diagnostics=1
              {
                echo "===== $diagnostics_file ====="
                cat "$diagnostics_file"
              } | tee -a "$transcript_path"
            done < <(find Build HelloUltraviolet/Build -type f -name source-native-test-diagnostics.log 2>/dev/null | sort)
            if [ "$found_diagnostics" -eq 0 ]; then
              echo "No source-native test diagnostics log found." | tee -a "$transcript_path"
            fi
          }
          release_configure_args=()
          if [ -n "${UV_RELEASE_VERSION:-}" ]; then
            release_configure_args+=("--cmake-configure-arg=-DUV_COMPILER_VERSION_OVERRIDE:STRING=${UV_RELEASE_VERSION}")
          fi
          set +e
          python3 Tools/RunHelloVerification.py \
            --target-profile aarch64-darwin \
            --cmake "$UV_CMAKE_EXE" \
            --pr "${GITHUB_REF_NAME}" \
            --nonce "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "${release_configure_args[@]}" \
            2>&1 \
            | tee artifacts/hello-verification-macos.txt
          verification_status=${PIPESTATUS[0]}
          set -e
          if [ "$verification_status" -ne 0 ]; then
            print_source_native_diagnostics artifacts/hello-verification-macos.txt
          fi
          exit "$verification_status"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hello-verification-macos
          path: |
            artifacts/hello-verification-macos.txt
            artifacts/runtime-logs/**
            Build/Tests/**/*.log
            Build/Tests/**/*.out
            Build/Tests/**/*.err
            Build/Tests/**/*.json
            Build/Tests/**/*.evidence
            HelloUltraviolet/Build/Tests/**/*.log
            HelloUltraviolet/Build/Tests/**/*.out
            HelloUltraviolet/Build/Tests/**/*.err
            HelloUltraviolet/Build/Tests/**/*.json
            HelloUltraviolet/Build/Tests/**/*.evidence
          if-no-files-found: ignore

      - name: Upload macOS release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ultraviolet-macos-aarch64
          path: |
            Build/Release/ultraviolet-macos-aarch64.tar.gz
            Build/Release/ultraviolet-macos-aarch64.tar.gz.sha256
          if-no-files-found: error
