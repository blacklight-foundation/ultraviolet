name: HelloUltraviolet Linux Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: x86_64-sysv
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          lfs: false

      - name: Install CMake 4.0.2
        run: |
          python3 -m pip install --user cmake==4.0.2
          scripts_dir="$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts", scheme="posix_user"))')"
          cmake_exe="${scripts_dir}/cmake"
          test -x "$cmake_exe"
          echo "${scripts_dir}" >> "$GITHUB_PATH"
          echo "UV_CMAKE_EXE=$cmake_exe" >> "$GITHUB_ENV"

      - name: Verify host tools
        run: |
          "$UV_CMAKE_EXE" --version
          python3 --version

      - name: Fetch target extern payloads
        run: python3 Tools/FetchTargetExterns.py --target-profile x86_64-sysv

      - name: Run HelloUltraviolet verification
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 Tools/RunHelloVerification.py \
            --target-profile x86_64-sysv \
            --cmake "$UV_CMAKE_EXE" \
            --pr "${GITHUB_REF_NAME}" \
            --nonce "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            | tee artifacts/hello-verification-linux.txt

      - name: Upload verification transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hello-verification-linux
          path: artifacts/hello-verification-linux.txt
          if-no-files-found: ignore

      - name: Upload Linux release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ultraviolet-linux-x86_64
          path: |
            Build/Release/ultraviolet-linux-x86_64.tar.gz
            Build/Release/ultraviolet-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
